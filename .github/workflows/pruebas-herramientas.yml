name: pruebas-herramientas
on:
  push:
    paths: ["herramientas/**", ".github/workflows/pruebas-herramientas.yml"]
  pull_request:
    paths: ["herramientas/**", ".github/workflows/pruebas-herramientas.yml"]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q herramientas
