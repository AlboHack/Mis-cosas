name: pruebas-utfsm-calc
on:
  push:
    paths: ["utfsm-calc/**", ".github/workflows/pruebas.yml"]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e utfsm-calc pytest
      - run: pytest -q utfsm-calc/tests
